# Publishes a release to npm and to the official MCP Registry when a version tag
# (v1.2.3) is pushed, or when run by hand from the Actions tab / API
# (workflow_dispatch on main: publishes the version in package.json and then
# creates the v<version> tag). Follows
# https://modelcontextprotocol.io/registry/github-actions.md (OIDC authentication
# for the registry; NPM_TOKEN secret for npm).
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # MCP Registry OIDC login and npm provenance
      contents: write # create the version tag on manual runs
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Version to publish
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            if [ "${GITHUB_REF_NAME}" != "main" ]; then echo "Manual runs publish from main only"; exit 1; fi
            V="$(node -p 'require("./package.json").version')"
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then echo "Tag v$V already exists"; exit 1; fi
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Version matches package.json, server.json and plugin.json
        run: |
          TAG="${{ steps.ver.outputs.version }}"
          node -e '
            const t = process.argv[1], p = require("./package.json"), s = require("./server.json"), m = require("./.claude-plugin/plugin.json");
            for (const [k, v] of [["package.json", p.version], ["server.json", s.version], ["server.json package", s.packages[0].version], ["plugin.json", m.version]])
              if (v !== t) { console.error(`${k} is ${v}, tag is ${t}`); process.exit(1); }
          ' "$TAG"

      - name: Publish package to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Create the version tag (manual runs)
        if: github.ref_type != 'tag'
        run: |
          git tag "v${{ steps.ver.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.ver.outputs.version }}"
